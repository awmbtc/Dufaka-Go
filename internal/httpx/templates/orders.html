{{define "orders.html"}}{{template "head" .}}
<section class="main-container">
    <div class="container">
        {{range .Orders}}
        <div class="card m-3">
            <div class="card-body">
                <h5>订单号：{{.SN}}</h5>
                <div class="mb-1">商品：{{.Title}} × {{.Amount}}</div>
                <div class="mb-1">金额：¥{{yuan .Actual}}</div>
                <div class="mb-1">状态：{{status .Status}}</div>
                <pre class="mb-0">{{.Info}}</pre>
            </div>
        </div>
        {{end}}
    </div>
</section>
{{template "foot" .}}{{end}}
