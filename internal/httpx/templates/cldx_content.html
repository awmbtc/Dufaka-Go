{{define "cldx-content"}}
<h3>cldx 支付</h3><p>订单号：{{.Order.SN}}</p>
<p class="cldx-amount">{{.Cldx}} cldx</p><p>¥{{yuan .Order.Actual}}</p>
{{template "payclock" .}}
<div data-pay-now>{{if .Direct}}
<p>请在 Clodex 中确认这笔付款。</p><a class="cldx-launch" href="{{.AppLink}}">使用 cldx 支付</a>
{{else}}<img class="payment-qr" alt="Clodex 付款码" src="data:image/png;base64,{{.QR}}"><p>打开 Clodex，在鹤立页点「扫码付款」。</p>{{end}}</div>
<p id="pay-state" role="status" aria-live="polite"></p>
<a href="/detail-order-sn/{{.Order.SN}}">查看订单</a>
{{end}}
