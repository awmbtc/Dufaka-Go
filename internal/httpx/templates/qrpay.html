{{define "qrpay.html"}}{{template "head" .}}
<section class="main-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card mt-3">
                    <div class="card-body text-center">
                        <h3>扫码支付</h3>
                        <p>{{.Pay.Name}}</p>
                        <p>订单号：{{.Order.SN}}</p>
                        <p class="text-danger">¥{{yuan .Order.Actual}}</p>
                        <img alt="支付二维码" src="data:image/png;base64,{{.QR}}">
                        <p class="mt-3 text-muted">请使用微信扫一扫完成支付。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{{template "foot" .}}{{end}}
