{{define "qrpay.html"}}{{template "head" .}}
<section class="main-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card mt-3">
                    <div class="card-body text-center">
                        <h3>扫码支付</h3>
                        <p>{{.Pay.Name}}</p>
                        <p>订单号：{{.Order.SN}}</p>
                        <p class="text-danger">¥{{yuan .Order.Actual}}</p>
                        <img alt="支付二维码" src="data:image/png;base64,{{.QR}}">
                        <p class="mt-3 text-muted">请使用微信扫一扫完成支付。支付成功后会自动打开订单。</p>
                        <p id="pay-state" class="text-muted"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<script>
(function () {
  var sn = "{{.Order.SN}}";
  var state = document.getElementById("pay-state");
  var timer = setInterval(function () {
    fetch("/check-order-status/" + encodeURIComponent(sn)).then(function (r) { return r.json(); }).then(function (res) {
      if (res.code === 400001) { clearInterval(timer); if (state) state.textContent = "订单已过期"; setTimeout(function () { location.href = "/"; }, 1200); }
      if (res.code === 200) { clearInterval(timer); if (state) state.textContent = "支付成功，正在打开订单"; location.href = "/detail-order-sn/" + encodeURIComponent(sn); }
    }).catch(function () {});
  }, 5000);
})();
</script>
{{template "foot" .}}{{end}}
