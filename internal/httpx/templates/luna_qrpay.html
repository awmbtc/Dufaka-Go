{{define "luna_qrpay.html"}}<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>扫码支付 | {{.Site.Title}}</title>
<link rel="stylesheet" href="/assets/luna/layui/css/layui.css"><link rel="stylesheet" href="/assets/luna/main.css"></head>
<body>
<div class="background"></div>
<div class="main"><div class="layui-row"><div class="layui-col-md8 layui-col-md-offset2"><div class="main-box" style="text-align:center">
<div class="pay-title">扫码支付</div>
<p>{{.Pay.Name}} · {{.Order.SN}}</p>
<p class="price"><span class="price-sign">￥</span><span class="price-num">{{yuan .Order.Actual}}</span></p>
<img alt="支付二维码" src="data:image/png;base64,{{.QR}}">
<p>请使用微信扫一扫完成支付。</p>
<p id="pay-state"></p>
</div></div></div></div>
<script>
(function () {
  var sn = "{{.Order.SN}}";
  var state = document.getElementById("pay-state");
  var timer = setInterval(function () {
    fetch("/check-order-status/" + encodeURIComponent(sn)).then(function (r) { return r.json(); }).then(function (res) {
      if (res.code === 400001) { clearInterval(timer); if (state) state.textContent = "订单已过期"; setTimeout(function () { location.href = "/"; }, 1200); }
      if (res.code === 200) { clearInterval(timer); if (state) state.textContent = "支付成功，正在打开订单"; location.href = "/detail-order-sn/" + encodeURIComponent(sn); }
    }).catch(function () {});
  }, 5000);
})();
</script>
</body></html>{{end}}
