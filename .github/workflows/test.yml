name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shop_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        env:
          DUFAKA_TEST_DATABASE_URL: postgresql://shop_test@127.0.0.1:5432/postgres
        run: go test -race -count=1 -timeout 10m ./...
      - name: govulncheck
        # Pinned so a new scanner release cannot turn CI red on its own; bump on purpose.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
